# Never fetch a JDK behind the developer's back. If no Java 11 toolchain is
# found the `testJava11` task is simply not registered and the build stays green.
org.gradle.java.installations.auto-download=false

# Where to look for the Java 11 toolchain, in addition to Gradle's own
# auto-detection. JAVA_HOME_11_X64 is what actions/setup-java exports in CI;
# JDK11 is the local convention — point it at any JDK 11 installation, e.g.
#   export JDK11=$(mise where java@temurin-11)
# Installations in a version manager's directory (mise, asdf) are NOT
# auto-detected; alternatively list them once in ~/.gradle/gradle.properties:
#   org.gradle.java.installations.paths=/path/to/jdk11
org.gradle.java.installations.fromEnv=JDK11,JAVA_HOME_11_X64,JAVA_HOME_11_ARM64
